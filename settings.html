{% extends 'base.html' %}{% block title %}Business profile{% endblock %}
{% block content %}<div class="page-heading compact"><div><div class="eyebrow">CONFIGURATION</div><h1>Business profile</h1><p class="muted">These details appear on every document you create.</p></div></div><form method="post" class="document-form narrow"><section class="form-section"><div class="section-heading"><div><h2>Company details</h2><p class="muted">Keep your legal and contact information current.</p></div></div><div class="form-grid two"><label>Business name<input name="business_name" value="{{ profile.business_name }}" required></label><label>GSTIN<input name="gstin" value="{{ profile.gstin }}" required></label><label class="span-2">Business address<textarea name="address" rows="3" required>{{ profile.address }}</textarea></label><label>Phone<input name="phone" value="{{ profile.phone }}" required></label><label>Email<input type="email" name="email" value="{{ profile.email }}" required></label><label>State<input name="state" value="{{ profile.state }}" required></label><label>State code<input name="state_code" value="{{ profile.state_code }}" required><small class="field-help">Used to determine CGST/SGST versus IGST.</small></label></div></section><div class="form-actions"><button class="button primary" type="submit">Save profile →</button></div></form>{% endblock %}
